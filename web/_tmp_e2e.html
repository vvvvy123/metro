<!doctype html>
<html><head><meta charset="utf-8"><title>tmp e2e</title></head>
<body>
<pre id="out">running…</pre>
<script>
/* TEMPORARY end-to-end test. Loads the DEPLOYED page in an iframe and drives the
   real frontend, so the write travels the whole chain:
     browser -> same-origin /api -> Vercel function (sin1) -> PgBouncer -> Neon
   A curl against /api proves the function works; only this proves the shipped
   frontend actually uses it. Delete this file after use. */
const log=[];const out=document.getElementById("out");
function p(...a){log.push(a.join(" "));out.textContent=log.join("\n");}
function ok(c,l,e){p((c?"PASS  ":"FAIL  ")+l+(e!==undefined?"  -> "+e:""));}

let DEV="(unknown)";
const f=document.createElement("iframe");
f.style.cssText="width:390px;height:260px";
f.src="/";                       // same origin as this page => the deployed site
f.onload=async()=>{
  const w=f.contentWindow, ev=s=>w.eval(s);
  // DEVICE is computed at module load, so it cannot be pre-set from here — read
  // the page's real one instead and use THAT to find the row in Neon afterwards.
  for(let i=0;i<150;i++){ if(ev("typeof CITY!=='undefined'&&CITY")) break; await new Promise(r=>setTimeout(r,50)); }
  DEV=ev("DEVICE");
  await new Promise(r=>setTimeout(r,600));
  try{ await run(w,ev); }catch(e){ p("HARNESS ERROR: "+((e&&e.stack)||e)); }
  p("__DONE__");
};
document.body.appendChild(f);

async function run(w,ev){
  p("device = "+DEV);
  p("MODE   = "+ev("MODE")+"   API_BASE = "+JSON.stringify(ev("API_BASE")));
  ok(ev("MODE")==="api","the DEPLOYED frontend is in api mode (not the static fallback)");
  ok(ev("API_BASE")==="","API_BASE is same-origin",JSON.stringify(ev("API_BASE")));
  ok(/^dev-/.test(DEV),"page has a device id",DEV);

  const cities=await ev('DL.searchCities("")');
  ok(cities.length===10,"10 cities from Neon via the function",cities.length);
  const xzm=(await ev('DL.stations("beijing","西直")'))[0];
  ok(!!xzm&&xzm.id==="bj-150998293","station search through the function",xzm&&xzm.id);
  const td=(await ev('DL.directions("bj-l13")')).find(d=>d.name.indexOf("东直门")>=0);
  const T={station:xzm.id,from_line:"bj-l2",from_dir:"bj-l2-内环",to_line:"bj-l13",to_dir:td.id};
  let ans=await ev(`DL.answers(${JSON.stringify(T)})`);
  ok(ans.length===2,"2 seed answers for the seeded transfer",ans.length);
  ok(ans.every(a=>typeof a.score==="number"),"ranking computed server-side");
  const target=ans[0], before=target.likes;
  p("  target answer id="+target.id+" likes="+before);

  // THE WRITE
  const v=await ev(`DL.vote(${JSON.stringify(target.id)},"LIKE")`);
  ok(v&&v.likes===before+1,"vote accepted by the function",JSON.stringify(v));
  ans=await ev(`DL.answers(${JSON.stringify(T)})`);
  const after=ans.find(a=>a.id===target.id);
  ok(after.likes===before+1,"re-read shows the new count (came back from Neon)",after.likes);
  ok(after.my_vote==="LIKE","my_vote reflects this device");

  // a comment too, so a text field crosses the whole chain
  const cBefore=after.comments.length;
  await ev(`DL.comment(${JSON.stringify(target.id)},"e2e ${DEV} 重音 Défense")`);
  ans=await ev(`DL.answers(${JSON.stringify(T)})`);
  const a2=ans.find(a=>a.id===target.id);
  ok(a2.comments.length===cBefore+1,"comment stored and read back",a2.comments.length);
  ok(a2.comments.some(c=>c.text.indexOf("Défense")>=0),"non-ASCII survived the round trip");

  // quota must apply on the deployed function too
  let last=null;
  for(let i=0;i<5;i++){ try{ last=await ev(`DL.addCity("e2e城${i}")`); }catch(e){ last={err:(e&&e.message)||String(e)}; break; } }
  ok(last&&last.err&&/limit/i.test(last.err),"per-device quota enforced in production",JSON.stringify(last));

  p("=== "+log.filter(l=>l.startsWith("PASS")).length+" passed, "+log.filter(l=>l.startsWith("FAIL")).length+" failed ===");
  p("VERIFY_DEVICE="+DEV);
  p("VERIFY_ANSWER="+target.id);
}
</script>
</body></html>
